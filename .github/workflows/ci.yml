# Ejecuta solo lo que cambió: Gradle para apps/movil, npm para apps/web.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Dataset y tokens idénticos en móvil y web
        run: cmp packages/tokens/dataset.json apps/movil/app/src/main/assets/dataset.json && cmp packages/tokens/dataset.json apps/web/public/dataset.json && cmp packages/tokens/tokens.css apps/web/src/tokens.css

  cambios:
    runs-on: ubuntu-24.04
    outputs:
      movil: ${{ steps.filtro.outputs.movil }}
      web: ${{ steps.filtro.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            movil:
              - 'apps/movil/**'
              - 'packages/tokens/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/tokens/**'
              - '.github/workflows/ci.yml'

  movil:
    needs: cambios
    if: needs.cambios.outputs.movil == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/movil
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Lint y pruebas unitarias
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon
      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/movil/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  web:
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npx ng test --watch=false
      - name: Build de producción
        run: npx ng build --configuration production
