# Al crear un tag vX.Y.Z compila el APK de release (firmado con el keystore de depuración,
# suficiente para la prueba del curso) y lo adjunta a una GitHub Release.
#
# Requisito en apps/movil/app/build.gradle.kts:
#   signingConfigs { create("release") { initWith(getByName("debug")) } }
#   buildTypes { release { signingConfig = signingConfigs.getByName("release"); isMinifyEnabled = false } }
name: APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/movil
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      # La firma de release hereda del keystore de depuración, y ese archivo lo genera Android Studio (o el
      # primer assembleDebug) en la máquina de cada quien: un runner recién creado no lo tiene y
      # validateSigningRelease falla con «Keystore file ~/.android/debug.keystore not found». Se crea aquí con
      # las credenciales fijas que Android usa siempre para depuración (android/androiddebugkey), públicas y
      # sin valor de seguridad: el APK queda firmado para instalar en un celular de prueba, no para Play.
      # El keystore sale del secreto DEBUG_KEYSTORE_BASE64 (mismas credenciales) para que todas las versiones
      # tengan la misma firma y cada APK se instale como actualización del anterior; sin el secreto (p. ej. en
      # un fork) se genera uno nuevo y el APK solo se instala tras desinstalar la versión previa.
      - name: Crear el keystore de depuración
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            exit 0
          fi
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        working-directory: .
      - name: Compilar APK de release
        run: ./gradlew assembleRelease --no-daemon
      - name: Renombrar con la versión
        run: cp app/build/outputs/apk/release/app-release.apk "alarmas-qr-${GITHUB_REF_NAME}.apk"
      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v3
        with:
          name: Alarmas QR ${{ github.ref_name }}
          files: apps/movil/alarmas-qr-${{ github.ref_name }}.apk
          generate_release_notes: true
